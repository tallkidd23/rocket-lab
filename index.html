<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LabRocket LR-1983 Science Computer</title>
  <link rel="stylesheet" href="shell.css">
</head>
<body>
  <main class="rocket-lab" id="labrocket">
    <section class="rocket-shell" aria-label="LabRocket LR-1983 science computer">
      <header class="nose-cap">
        <span>LABROCKET</span>
        <small>LR-1983 / SCIENCE COMPUTER</small>
      </header>

      <div class="control-deck">
        <aside class="left-pod" aria-label="Navigation controls">
          <div class="pod-label">NAV / CARTRIDGE</div>
          <button class="dpad up" data-command="PREV" aria-label="Previous cartridge">▲</button>
          <button class="dpad left" data-command="PREV" aria-label="Previous cartridge">◀</button>
          <button class="dpad center" data-command="ENTER" aria-label="Select cartridge">●</button>
          <button class="dpad right" data-command="NEXT" aria-label="Next cartridge">▶</button>
          <button class="dpad down" data-command="NEXT" aria-label="Next cartridge">▼</button>
          <button class="small-button" data-command="EJECT">EJECT</button>
        </aside>

        <section class="display housing">
          <div class="screen-topline">
            <span id="screenHeader">LABROCKET COMPUTER</span>
            <span id="powerLight">●</span>
          </div>
          <div id="screen" class="screen" tabindex="0" aria-live="polite">
            <div id="bootLayer" class="screen-layer boot-layer"></div>
            <div id="programLayer" class="screen-layer program-layer" hidden></div>
            <div class="screen-glass"></div>
          </div>
        </section>

        <aside class="right-pod" aria-label="Action controls">
          <div class="pod-label">ACTION</div>
          <button class="round-button button-a" data-command="RUN">A</button>
          <button class="round-button button-b" data-command="STOP">B</button>
          <button class="round-button button-c" data-command="MODE">C</button>
          <button class="small-button start-button" data-command="RUN">START</button>
          <button class="small-button select-button" data-command="ENTER">SELECT</button>
        </aside>
      </div>

      <section class="keyboard-area">
        <div class="keyboard-label">MICRO KEYBOARD / CARTRIDGE INPUT</div>
        <div id="keyboard" class="keyboard">
          <button data-command="RUN">RUN</button><button data-command="STOP">STOP</button><button data-command="MODE">MODE</button><button data-command="CLEAR">CLEAR</button><button data-command="EJECT">EJECT</button>
          <button data-command="PREV">PREV</button><button data-command="NEXT">NEXT</button><button data-command="ENTER">ENTER</button><button data-command="ZOOM_OUT">-</button><button data-command="ZOOM_IN">+</button>
        </div>
      </section>

      <section class="cartridge-bay" aria-label="Cartridge bay">
        <div class="bay-label">CARTRIDGE BAY / SELECT PROGRAM</div>
        <div id="cartridgeRail" class="cartridge-rail">
          <button class="cartridge-card is-selected" data-cartridge="patterns"><span class="cartridge-number">01</span><span>PATTERNS</span><small>MATH / FORM</small></button>
          <button class="cartridge-card" data-cartridge="gravity"><span class="cartridge-number">02</span><span>GRAVITY FORGE</span><small>ASTROPHYSICS</small></button>
          <button class="cartridge-card" data-cartridge="reef"><span class="cartridge-number">03</span><span>SYNAPSE REEF</span><small>EMERGENT LIFE</small></button>
        </div>
      </section>

      <footer class="shell-footer">
        <span>MODEL LR-1983</span><span>BATTERY: GOOD</span><span id="cartridgeReadout">CARTRIDGE: PATTERNS</span>
      </footer>
    </section>
  </main>
  <script src="shell.js"></script>
</body>
</html>
